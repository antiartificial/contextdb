apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "contextdb.fullname" . }}-backend-smoke"
  labels:
    {{- include "contextdb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: backend-smoke
      image: curlimages/curl:8.12.1
      command:
        - /bin/sh
        - -ec
        - |
          base_url="http://{{ include "contextdb.fullname" . }}:{{ .Values.service.restPort }}"
          curl --fail --silent --show-error --retry 5 --retry-connrefused "$base_url/v1/ping"
          curl --fail --silent --show-error --retry 5 --retry-connrefused "$base_url/v1/backends"
